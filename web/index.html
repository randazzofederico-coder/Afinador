<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Afinador Musical - Afinador cromático de instrumentos musicales con detección de frecuencia en tiempo real.">

  <!-- PWA meta tags -->
  <meta name="theme-color" content="#121212">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Afinador">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Afinador Musical</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Splash screen: visible instantly while Flutter downloads/boots, and
    visually identical to the app's own loading screen (AuthGate), so the
    hand-off is seamless. Removed on Flutter's first rendered frame.
  -->
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #121212;
      color-scheme: dark;
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #121212;
      transition: opacity 250ms ease-out;
    }
    #splash.splash-hidden {
      opacity: 0;
      pointer-events: none;
    }
    #splash img {
      width: 120px;
      height: 120px;
      border-radius: 20px;
      animation: splash-breathe 1.6s ease-in-out infinite;
    }
    @keyframes splash-breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.75; }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash img { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash" role="img" aria-label="Cargando Afinador">
    <!-- Same file Flutter's Image.asset loads, so it's cached for the app. -->
    <img src="assets/assets/icon/app_icon.png" alt="">
  </div>
  <script>
    (function () {
      var removed = false;
      function removeSplash() {
        if (removed) return;
        removed = true;
        var splash = document.getElementById('splash');
        if (!splash) return;
        splash.classList.add('splash-hidden');
        setTimeout(function () { splash.remove(); }, 300);
      }
      // Dispatched by the Flutter web engine after its first frame.
      window.addEventListener('flutter-first-frame', removeSplash, { once: true });
      // Safety net: never cover the app forever if the event is missed.
      setTimeout(removeSplash, 20000);
    })();
  </script>
  <script>
    // PWA Install bridge for Flutter
    function _flutterPwaPrompt(event) {
      if (event && event.prompt) {
        event.prompt();
      }
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
